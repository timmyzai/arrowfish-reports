<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/ui-i18n.js"></script>
    <script src="assets/site-preferences.js"></script>
    <meta name="robots" content="noindex, nofollow">
    <title>Arrowfish VPN — 阶段报告</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/ai-chat.css?v=20260828-11">
    <link rel="stylesheet" href="assets/copy-markdown.css">
    <script src="assets/report-evidence.js?v=20260828-11" defer></script>
    <script src="assets/ai-chat.js?v=20260828-11" defer></script>
    <script src="assets/copy-markdown.js" defer></script>
    <style>
        /* ── Main App ── */
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .toolbar {
            display: flex; align-items: center; gap: 16px; padding: 12px 24px;
            background: var(--af-surface); border-bottom: 1px solid var(--af-border);
            color: var(--af-text); box-shadow: 0 1px 3px var(--af-shadow); flex-shrink: 0; flex-wrap: wrap;
        }
        .toolbar h1 { font-size: 16px; font-weight: 600; color: var(--af-primary); white-space: nowrap; }
        .view-tabs { display: flex; align-items: center; gap: 4px; padding: 3px; background: var(--af-surface-muted); border-radius: 8px; }
        .view-tab {
            min-height: 44px; padding: 7px 12px; border: 0; border-radius: 6px;
            color: var(--af-text-muted); background: transparent; font: inherit; font-size: 14px;
            font-weight: 600; cursor: pointer;
        }
        .view-tab:hover { color: var(--af-primary); background: var(--af-surface); }
        .view-tab:focus-visible { outline: 2px solid var(--af-focus); outline-offset: 2px; }
        .view-tab[aria-selected="true"] { color: var(--af-primary); background: var(--af-surface); box-shadow: 0 1px 2px var(--af-shadow); }
        .toolbar select {
            padding: 6px 12px; border: 1px solid var(--af-border); border-radius: 6px; color: var(--af-text);
            min-height: 44px; font-size: 14px; background: var(--af-surface-muted); cursor: pointer; min-width: 240px;
        }
        .toolbar select:focus-visible { outline: 2px solid var(--af-focus); outline-offset: 2px; border-color: var(--af-focus); }
        .toolbar .date { font-size: 13px; color: var(--af-text-muted); }
        iframe { flex: 1; width: 100%; border: none; }
        .loading { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--af-text-muted); font-size: 15px; background: var(--af-bg); }
        @media (max-width: 720px) {
            .toolbar { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
            .toolbar h1 { width: 100%; margin: 0; }
            .toolbar select { flex: 1; min-width: 0; }
            .toolbar .date { display: none; }
        }
    </style>
    <link rel="stylesheet" href="assets/site-theme.css">
    <script src="assets/auth-gate.js" data-content="#app-content"></script>
</head>
<body>
    <!-- ── Main Content ── -->
    <div id="app-content" style="display:none; flex-direction:column; height:100vh;">
        <header class="toolbar" data-site-header>
            <h1>Arrowfish VPN</h1>
            <div class="view-tabs" role="tablist" aria-label="报告视图">
                <button class="view-tab" id="goals-tab" type="button" role="tab" aria-controls="report-frame" aria-selected="true">项目目标</button>
                <button class="view-tab" id="reports-tab" type="button" role="tab" aria-controls="report-frame" aria-selected="false">阶段报告</button>
            </div>
            <select id="sprint-select" aria-label="选择阶段报告"></select>
            <span class="date" id="sprint-date"></span>
            <div class="copy-markdown-action">
                <button class="copy-markdown-button" id="copy-markdown-button" type="button" disabled aria-describedby="copy-markdown-status">
                    <svg class="copy-markdown-icon copy-markdown-icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect width="14" height="14" x="8" y="8" rx="2"/>
                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                    </svg>
                    <svg class="copy-markdown-icon copy-markdown-icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m5 12 4 4L19 6"/>
                    </svg>
                    <span class="copy-markdown-label">复制为 Markdown</span>
                </button>
                <span class="copy-markdown-status" id="copy-markdown-status" role="status" aria-live="polite"></span>
            </div>
        </header>
        <div class="loading" id="loading">正在加载报告…</div>
        <iframe id="report-frame" role="tabpanel" aria-labelledby="goals-tab" title="项目目标内容" style="display:none"></iframe>
    </div>

    <script>
        const tr = (key, params) => window.ArrowfishI18n.t(key, params);
        const language = () => window.ArrowfishI18n.getLanguage();
        let appInitialized = false;
        let reportsData = [];

        function localizedName(report) {
            if (!report) return '';
            return typeof report.name === 'object'
                ? (report.name[language()] || report.name['zh-CN'] || '')
                : report.name;
        }

        function localizedDate(value) {
            if (!value) return '';
            return new Intl.DateTimeFormat(language() === 'en' ? 'en' : 'zh-CN', {
                dateStyle: 'medium',
                timeZone: 'UTC'
            }).format(new Date(value + 'T00:00:00Z'));
        }

        function applyShellLanguage() {
            document.title = tr('document.siteTitle');
            document.querySelector('.view-tabs').setAttribute('aria-label', tr('nav.views'));
            document.getElementById('goals-tab').textContent = tr('nav.goals');
            document.getElementById('reports-tab').textContent = tr('nav.reports');
            document.getElementById('sprint-select').setAttribute('aria-label', tr('nav.selectReport'));
            document.querySelector('.copy-markdown-label').textContent = tr('copy.action');
            const loading = document.getElementById('loading');
            if (loading.style.display !== 'none') loading.textContent = tr('nav.loading');
            document.getElementById('report-frame').title = document.getElementById('goals-tab').getAttribute('aria-selected') === 'true'
                ? tr('nav.goalContent') : tr('nav.reportContent');
            const select = document.getElementById('sprint-select');
            Array.from(select.options).forEach((option, index) => {
                if (reportsData[index]) option.textContent = localizedName(reportsData[index]);
            });
            const date = document.getElementById('sprint-date');
            if (date.dataset.date) date.textContent = localizedDate(date.dataset.date);
        }

        window.addEventListener('arrowfish:auth-unlocked', initApp);
        window.addEventListener('arrowfish:preferenceschange', event => {
            applyShellLanguage();
            const frame = document.getElementById('report-frame');
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({ type: 'arrowfish:preferences', state: event.detail }, location.origin);
            }
        });
        applyShellLanguage();
        /* ── App Logic ── */
        function initApp() {
            if (appInitialized) return;
            appInitialized = true;

            const select = document.getElementById('sprint-select');
            const frame = document.getElementById('report-frame');
            const dateEl = document.getElementById('sprint-date');
            const loading = document.getElementById('loading');
            const goalsTab = document.getElementById('goals-tab');
            const reportsTab = document.getElementById('reports-tab');
            let sprints = [];
            let goal = null;

            fetch('reports.json')
                .then(r => r.json())
                .then(data => {
                    goal = data.find(isGoal) || null;
                    sprints = data
                        .filter(report => !isGoal(report))
                        .map((report, sourceIndex) => ({ ...report, sourceIndex }))
                        .sort((a, b) => a.date.localeCompare(b.date) || a.sourceIndex - b.sourceIndex);
                    reportsData = sprints;
                    sprints.forEach((s, i) => {
                        const opt = document.createElement('option');
                        opt.value = i;
                        opt.textContent = localizedName(s);
                        select.appendChild(opt);
                    });
                    goalsTab.hidden = !goal;
                    loadFromHash();
                })
                .catch(() => { loading.textContent = tr('nav.loadFailed'); });

            select.addEventListener('change', () => {
                const index = parseInt(select.value);
                loadSprint(index);
            });

            goalsTab.addEventListener('click', () => {
                if (goal) loadEntry(goal, 'goals');
            });

            reportsTab.addEventListener('click', () => {
                const index = Number.isInteger(parseInt(select.value)) ? parseInt(select.value) : sprints.length - 1;
                loadSprint(index);
            });

            window.addEventListener('hashchange', loadFromHash);
            frame.addEventListener('load', () => {
                if (frame.contentWindow) frame.contentWindow.postMessage({ type: 'arrowfish:preferences', state: window.ArrowfishPreferences.get() }, location.origin);
            });

            function isGoal(report) {
                return report.id.startsWith('goal-') || report.file.includes('/Goal-');
            }

            function loadFromHash() {
                let hash = '';
                try {
                    hash = decodeURIComponent(location.hash.slice(1));
                } catch (error) {
                    loadDefault(false);
                    return;
                }
                if (!hash) {
                    loadDefault();
                    return;
                }
                const [id, date] = hash.split('/');
                if (goal && id === goal.id && (!date || date === goal.date)) {
                    loadEntry(goal, 'goals', false);
                    return;
                }
                if (id && date) {
                    const exact = sprints.findIndex(s => s.id === id && s.date === date);
                    if (exact !== -1) {
                        loadSprint(exact, false);
                        return;
                    }
                }
                if (id) {
                    let last = -1;
                    sprints.forEach((s, i) => { if (s.id === id) last = i; });
                    if (last !== -1) {
                        loadSprint(last, false);
                        return;
                    }
                }
                loadDefault(false);
            }

            function loadDefault(updateLocation = true) {
                if (goal) {
                    loadEntry(goal, 'goals', updateLocation);
                    return;
                }
                loadSprint(sprints.length - 1, updateLocation);
            }

            function updateHash(entry) {
                if (!entry) return;
                history.replaceState(null, '', '#' + entry.id + '/' + entry.date);
            }

            function loadSprint(index, updateLocation = true) {
                const sprint = sprints[index];
                if (!sprint) return;
                select.value = index;
                loadEntry(sprint, 'reports', updateLocation);
            }

            function loadEntry(entry, view, updateLocation = true) {
                const showingGoals = view === 'goals';
                goalsTab.setAttribute('aria-selected', showingGoals);
                reportsTab.setAttribute('aria-selected', !showingGoals);
                select.disabled = showingGoals;
                frame.setAttribute('aria-labelledby', showingGoals ? 'goals-tab' : 'reports-tab');
                frame.title = showingGoals ? tr('nav.goalContent') : tr('nav.reportContent');
                dateEl.dataset.date = entry.date;
                dateEl.textContent = localizedDate(entry.date);
                loading.style.display = 'none';
                frame.style.display = 'block';
                const frameSrc = entry.version
                    ? `${entry.file}?v=${encodeURIComponent(entry.version)}`
                    : entry.file;
                if (frame.getAttribute('src') !== frameSrc) frame.src = frameSrc;
                if (updateLocation) updateHash(entry);
            }
        }
    </script>
</body>
</html>
