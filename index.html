<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="assets/ui-i18n.js"></script>
    <script src="assets/site-preferences.js"></script>
    <script src="assets/report-catalog.js"></script>
    <meta name="robots" content="noindex, nofollow">
    <title>Arrowfish VPN — 阶段报告</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/ai-chat.css?v=20260829-13">
    <link rel="stylesheet" href="assets/copy-markdown.css">
    <script src="assets/report-evidence.js?v=20260829-13" defer></script>
    <script src="assets/report-brief.js?v=20260829-13" defer></script>
    <script src="assets/ai-chat.js?v=20260829-13" defer></script>
    <script src="assets/copy-markdown.js" defer></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .toolbar {
            display: flex; align-items: center; gap: 16px; padding: 12px 24px;
            background: var(--af-surface); border-bottom: 1px solid var(--af-border);
            color: var(--af-text); box-shadow: 0 1px 3px var(--af-shadow); flex-shrink: 0; flex-wrap: wrap;
        }
        .toolbar h1 { font-size: 16px; font-weight: 600; color: var(--af-primary); white-space: nowrap; }
        .view-tabs { display: flex; align-items: center; gap: 4px; padding: 3px; background: var(--af-surface-muted); border-radius: 8px; }
        .view-tab {
            min-height: 44px; padding: 7px 12px; border: 0; border-radius: 6px;
            color: var(--af-text-muted); background: transparent; font: inherit; font-size: 14px;
            font-weight: 600; cursor: pointer;
        }
        .view-tab:hover { color: var(--af-primary); background: var(--af-surface); }
        .view-tab:focus-visible { outline: 2px solid var(--af-focus); outline-offset: 2px; }
        .view-tab[aria-selected="true"] { color: var(--af-primary); background: var(--af-surface); box-shadow: 0 1px 2px var(--af-shadow); }
        .toolbar select {
            padding: 6px 12px; border: 1px solid var(--af-border); border-radius: 6px; color: var(--af-text);
            min-height: 44px; font-size: 14px; background: var(--af-surface-muted); cursor: pointer; min-width: 240px;
        }
        .toolbar select:focus-visible { outline: 2px solid var(--af-focus); outline-offset: 2px; border-color: var(--af-focus); }
        .toolbar .date { font-size: 13px; color: var(--af-text-muted); }
        [hidden] { display: none !important; }
        .related-reports { display:flex; align-items:center; gap:6px 16px; padding:6px 24px; flex-wrap:wrap; flex-shrink:0; border-bottom:1px solid var(--af-border); background:var(--af-surface); font-size:13px; }
        .related-reports span { color:var(--af-text-muted); }
        .related-reports a { display:inline-flex; align-items:center; min-height:44px; color:var(--af-primary); overflow-wrap:anywhere; }
        .related-reports a:focus-visible { outline:2px solid var(--af-focus); outline-offset:2px; }
        .toolbar select { max-width:100%; }
        #app-content:has(#goals-tab[aria-selected="true"]) .ai-brief-strip { display:none; }
        iframe { min-height:0; flex: 1; width: 100%; border: none; }
        .loading { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--af-text-muted); font-size: 15px; background: var(--af-bg); }
        @media (max-width: 720px) {
            .toolbar { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
            .toolbar h1 { width: auto; margin: 0; order: 1; }
            .toolbar > .preference-controls { order: 2; margin-left: auto; }
            .toolbar .view-tabs { order: 3; flex: 1; }
            .toolbar .copy-markdown-action { order: 4; width: auto; }
            .toolbar select { order: 5; flex-basis: 100%; }
            .toolbar .date { order: 6; }
            .toolbar .copy-markdown-button { width: 44px; padding: 10px; }
            .toolbar .copy-markdown-label { display: none; }
            .toolbar select { flex: 1; min-width: 0; }
            .toolbar .date { width:100%; font-size:12px; }
            .related-reports { padding:4px 12px; max-height:144px; overflow:auto; }
        }
    </style>
    <link rel="stylesheet" href="assets/site-theme.css">
</head>
<body>
    <div id="app-content" style="display:flex; flex-direction:column; height:100vh;">
        <header class="toolbar" data-site-header>
            <h1>Arrowfish VPN</h1>
            <div class="view-tabs" role="tablist" aria-label="报告视图">
                <button class="view-tab" id="goals-tab" type="button" role="tab" aria-controls="report-frame" aria-selected="true">项目目标</button>
                <button class="view-tab" id="reports-tab" type="button" role="tab" aria-controls="report-frame" aria-selected="false">阶段报告</button>
            </div>
            <select id="sprint-select" aria-label="选择阶段报告" hidden></select>
            <span class="date" id="sprint-date"></span>
            <div class="copy-markdown-action">
                <button class="copy-markdown-button" id="copy-markdown-button" type="button" disabled aria-describedby="copy-markdown-status">
                    <svg class="copy-markdown-icon copy-markdown-icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect width="14" height="14" x="8" y="8" rx="2"/>
                        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                    </svg>
                    <svg class="copy-markdown-icon copy-markdown-icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m5 12 4 4L19 6"/>
                    </svg>
                    <span class="copy-markdown-label">复制为 Markdown</span>
                </button>
                <span class="copy-markdown-status" id="copy-markdown-status" role="status" aria-live="polite"></span>
            </div>
        </header>
        <nav class="related-reports" id="related-reports" aria-label="同阶段其他报告" hidden></nav>
        <div class="loading" id="loading">正在加载报告…</div>
        <button class="ai-brief-strip" id="ai-brief-strip" type="button" hidden>
            <span class="ai-strip-badge" aria-hidden="true">✦</span>
            <span class="ai-strip-text"></span>
            <span class="ai-strip-cta"></span>
        </button>
        <iframe id="report-frame" role="tabpanel" aria-labelledby="goals-tab" title="项目目标内容" style="display:none"></iframe>
    </div>

    <script>
        const tr = (key, params) => window.ArrowfishI18n.t(key, params);
        const language = () => window.ArrowfishI18n.getLanguage();
        const Catalog = window.ArrowfishReportCatalog;
        let appInitialized = false;
        let groups = [];
        let reportsById = new Map();
        let currentEntry = null;
        let goal = null;
        let showingGoals = true;

        function shortName(report) {
            const names = report.shortName || report.name;
            return typeof names === 'object' ? (names[language()] || names['zh-CN']) : names;
        }
        function groupName(group) {
            return tr(group.start === group.end ? 'nav.sprint' : 'nav.sprintRange', group);
        }
        function optionName(report, recommended) {
            const date = report.contentThrough ? tr('nav.contentThrough', { date: report.contentThrough })
                : report.periodEnd ? tr('nav.periodThrough', { date: report.periodEnd }) : report.date;
            return [shortName(report), date, ...(recommended ? [tr('nav.recommended')] : [])].join(' · ');
        }
        function reportDates(entry) {
            if (Catalog.isGoal(entry)) return tr('nav.snapshot', { date: entry.date });
            const parts = [];
            if (entry.periodStart) parts.push(tr('nav.period', { start: entry.periodStart, end: entry.periodEnd }));
            if (entry.contentThrough) parts.push(tr('nav.contentThrough', { date: entry.contentThrough }));
            if (entry.publishedAt) parts.push(tr('nav.published', { date: entry.publishedAt }));
            return parts.length ? parts.join(' · ') : tr('nav.reportDate', { date: entry.date });
        }
        function renderCatalogue() {
            const select = document.getElementById('sprint-select');
            const selected = select.value;
            select.replaceChildren();
            groups.forEach(group => {
                const optgroup = document.createElement('optgroup');
                optgroup.label = groupName(group);
                group.reports.forEach(report => {
                    const option = document.createElement('option');
                    option.value = report.id;
                    option.textContent = optionName(report, report.id === group.recommendedId);
                    optgroup.appendChild(option);
                });
                select.appendChild(optgroup);
            });
            select.value = reportsById.has(selected) ? selected : defaultSprintId();
        }
        function renderRelated() {
            const nav = document.getElementById('related-reports');
            nav.replaceChildren();
            nav.setAttribute('aria-label', tr('nav.related'));
            const group = groups.find(item => item.reports.some(report => report.id === currentEntry?.id));
            nav.hidden = showingGoals || !group || group.reports.length < 2;
            if (nav.hidden) return;
            const label = document.createElement('span');
            label.textContent = tr('nav.related');
            nav.appendChild(label);
            group.reports.filter(report => report.id !== currentEntry.id).forEach(report => {
                const link = document.createElement('a');
                link.href = '#' + report.id + '/' + report.date;
                link.textContent = optionName(report, report.id === group.recommendedId);
                nav.appendChild(link);
            });
        }
        function applyShellLanguage() {
            document.title = tr('document.siteTitle');
            document.querySelector('.view-tabs').setAttribute('aria-label', tr('nav.views'));
            document.getElementById('goals-tab').textContent = tr('nav.goals');
            document.getElementById('reports-tab').textContent = tr('nav.reports');
            document.getElementById('sprint-select').setAttribute('aria-label', tr('nav.selectReport'));
            document.querySelector('.copy-markdown-label').textContent = tr('copy.action');
            document.getElementById('copy-markdown-button').setAttribute('aria-label', tr('copy.action'));
            document.getElementById('report-frame').title = tr(showingGoals ? 'nav.goalContent' : 'nav.reportContent');
            renderCatalogue();
            if (currentEntry) document.getElementById('sprint-date').textContent = reportDates(currentEntry);
            renderRelated();
        }
        function defaultSprintId() { return groups[0]?.recommendedId || ''; }
        function loadEntry(entry, updateLocation = true) {
            if (!entry) return;
            currentEntry = entry;
            showingGoals = Catalog.isGoal(entry);
            const select = document.getElementById('sprint-select');
            const frame = document.getElementById('report-frame');
            document.getElementById('goals-tab').setAttribute('aria-selected', showingGoals);
            document.getElementById('reports-tab').setAttribute('aria-selected', !showingGoals);
            select.hidden = showingGoals;
            select.disabled = showingGoals;
            if (!showingGoals) select.value = entry.id;
            frame.setAttribute('aria-labelledby', showingGoals ? 'goals-tab' : 'reports-tab');
            frame.title = tr(showingGoals ? 'nav.goalContent' : 'nav.reportContent');
            document.getElementById('sprint-date').textContent = reportDates(entry);
            document.getElementById('loading').style.display = 'none';
            frame.style.display = 'block';
            const src = entry.version ? `${entry.file}?v=${encodeURIComponent(entry.version)}` : entry.file;
            if (frame.getAttribute('src') !== src) frame.src = src;
            if (updateLocation) history.replaceState(null, '', '#' + entry.id + '/' + entry.date);
            renderRelated();
        }
        function loadFromHash() {
            let id = '';
            try { id = decodeURIComponent(location.hash.slice(1)).split('/')[0]; } catch (_) { /* Use the default view. */ }
            loadEntry(reportsById.get(id) || goal || reportsById.get(defaultSprintId()), !location.hash);
        }
        function initApp() {
            if (appInitialized) return;
            appInitialized = true;
            const select = document.getElementById('sprint-select');
            fetch('reports.json').then(response => {
                if (!response.ok) throw new Error('Catalogue unavailable');
                return response.json();
            }).then(data => {
                groups = Catalog.groupReports(data);
                reportsById = new Map(data.map(report => [report.id, report]));
                goal = data.find(Catalog.isGoal) || null;
                document.getElementById('goals-tab').hidden = !goal;
                renderCatalogue();
                loadFromHash();
            }).catch(() => { document.getElementById('loading').textContent = tr('nav.loadFailed'); });
            select.addEventListener('change', () => loadEntry(reportsById.get(select.value)));
            document.getElementById('goals-tab').addEventListener('click', () => loadEntry(goal));
            document.getElementById('reports-tab').addEventListener('click', () => loadEntry(reportsById.get(select.value || defaultSprintId())));
            window.addEventListener('hashchange', loadFromHash);
            const frame = document.getElementById('report-frame');
            const sendPreferences = () => frame.contentWindow?.postMessage({ type: 'arrowfish:preferences', state: window.ArrowfishPreferences.get() }, location.origin);
            frame.addEventListener('load', sendPreferences);
            window.addEventListener('arrowfish:preferenceschange', () => { applyShellLanguage(); sendPreferences(); });
        }
        applyShellLanguage();
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initApp);
        else initApp();
    </script>
</body>
</html>
